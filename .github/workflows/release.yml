name: Release & Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish-and-release:
    name: Publish and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      # Trusted publishing (OIDC) needs npm CLI >= 11.5.1; the npm bundled with
      # the runner may be older, so pin the latest.
      - name: Ensure a recent npm
        run: npm install -g npm@latest

      # Build on the pinned Node that will also publish the artifact.
      - name: Install dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # --- 1. PUBLISH TO NPM (trusted publishing, no token) ---
      # The npm CLI exchanges the OIDC id-token for short-lived credentials and
      # generates a provenance attestation. No NODE_AUTH_TOKEN is needed.
      - name: Publish to npm
        run: npm publish --access public --provenance

      # --- 2. CREATE GITHUB RELEASE ---
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --generate-notes
